<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RealTrade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080f1c;
      color: white;
    }

    header {
      background: #111a2e;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .container {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #121d33;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aebbd0;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #34425d;
      border-radius: 7px;
      background: #0b1220;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #19a957;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 7px;
      background: #19a957;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #148c48;
    }

    .forgot {
      text-align: right;
      margin: -8px 0 22px;
    }

    .forgot a,
    .register a {
      color: #28c76f;
      text-decoration: none;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #aebbd0;
    }

    .notice {
      margin-top: 20px;
      padding: 12px;
      background: #18253d;
      border-radius: 7px;
      color: #aebbd0;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">RealTrade</div>
    <a href="index.html">Home</a>
  </header>

  <div class="container">

    <div class="card">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your RealTrade account.
      </p>

      <form>

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">
          Login
        </button>

      </form>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

      <div class="notice">
        Real-money trading access will require appropriate account
        verification and connection to a regulated financial provider.
      </div>

    </div>

  </div>

</body>
</html>
