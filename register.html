<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | RealTrade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080f1c;
      color: white;
    }

    header {
      background: #111a2e;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .container {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #121d33;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aebbd0;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #34425d;
      border-radius: 7px;
      background: #0b1220;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #19a957;
    }

    .terms {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      color: #aebbd0;
      margin-bottom: 22px;
    }

    .terms input {
      width: auto;
      margin: 3px 0 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 7px;
      background: #19a957;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #148c48;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #aebbd0;
    }

    .login a {
      color: #28c76f;
      text-decoration: none;
    }

    .notice {
      margin-top: 20px;
      padding: 12px;
      background: #18253d;
      border-radius: 7px;
      color: #aebbd0;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">RealTrade</div>
    <a href="index.html">Home</a>
  </header>

  <div class="container">

    <div class="card">

      <h1>Create Your Account</h1>

      <p class="subtitle">
        Join RealTrade and get started with your trading account.
      </p>

      <form>

        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >

        <label for="confirm">Confirm Password</label>
        <input
          type="password"
          id="confirm"
          placeholder="Confirm your password"
          required
        >

        <div class="terms">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            I agree to the Terms of Service and Privacy Policy.
          </label>
        </div>

        <button type="submit">
          Create Account
        </button>

      </form>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <div class="notice">
        Your account registration and identity verification will be
        completed through the appropriate secure service before any
        real-money trading is enabled.
      </div>

    </div>

  </div>

</body>
</html>
